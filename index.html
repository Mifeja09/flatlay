<title>Flatlay</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F1E3CC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flatlay">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,900;1,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --canvas:#F1E3CC;
    --canvas-raised:#FBF2E1;
    --ink:#2B1B12;
    --ink-soft:#7C5A3E;
    --line:#D8BD90;
    --line-soft:#E7D3AC;
    --mustard:#C1602A;
    --mustard-strong:#A64D1E;
    --on-mustard:#2B1B12;
    --denim:#5C6B2E;
    --denim-soft:#E4E6C9;
    --berry:#7A2331;
    --berry-soft:#F1D9D9;
    --shadow:rgba(43,27,18,.16);
    --scrim:rgba(43,27,18,.55);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#1D140D;
      --canvas-raised:#251A10;
      --ink:#F4E7D3;
      --ink-soft:#C7A67F;
      --line:#4B3520;
      --line-soft:#382712;
      --mustard:#E2833F;
      --mustard-strong:#EFA05E;
      --on-mustard:#241505;
      --denim:#A7BB6E;
      --denim-soft:#2C3620;
      --berry:#E28698;
      --berry-soft:#3E2027;
      --shadow:rgba(0,0,0,.5);
      --scrim:rgba(0,0,0,.62);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#1D140D;
    --canvas-raised:#251A10;
    --ink:#F4E7D3;
    --ink-soft:#C7A67F;
    --line:#4B3520;
    --line-soft:#382712;
    --mustard:#E2833F;
    --mustard-strong:#EFA05E;
    --on-mustard:#241505;
    --denim:#A7BB6E;
    --denim-soft:#2C3620;
    --berry:#E28698;
    --berry-soft:#3E2027;
    --shadow:rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.62);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas);
    color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0;text-wrap:balance;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  button{font-family:inherit;}
  ::selection{background:var(--mustard);color:var(--on-mustard);}

  #shell{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:86px;
  }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 14px;
    gap:12px;
  }
  .brand{display:flex;align-items:center;gap:9px;}
  .brand svg{width:26px;height:26px;flex:none;color:var(--mustard-strong);}
  .brand-name{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-style:italic;
    font-size:1.5rem;
    letter-spacing:.2px;
  }
  .piece-count{
    font-size:.68rem;
    letter-spacing:.09em;
    color:var(--ink-soft);
    white-space:nowrap;
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 10px;
  }

  /* ---------- generic layout helpers ---------- */
  main{flex:1;padding:4px 20px 28px;}
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin:6px 0 16px;
  }
  .section-head h2{font-size:1.4rem;font-weight:600;}
  .eyebrow{
    font-size:.68rem;
    letter-spacing:.11em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  /* ---------- banner ---------- */
  .banner{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--denim-soft);
    color:var(--denim);
    border-radius:12px;
    padding:10px 14px;
    font-size:.82rem;
    margin:0 0 18px;
    line-height:1.35;
  }
  .banner svg{width:17px;height:17px;flex:none;}

  /* ---------- closet grid ---------- */
  .closet-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:14px;
  }
  .piece{
    background:var(--canvas-raised);
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:9px;
    cursor:pointer;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:7px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .piece:hover{box-shadow:0 6px 16px var(--shadow);transform:translateY(-1px);}
  .piece:active{transform:translateY(0);}
  .piece-photo-wrap{
    position:relative;
    aspect-ratio:1;
    border-radius:9px;
    overflow:hidden;
    background:var(--canvas);
  }
  .piece-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .piece-sample-pill{
    position:absolute;top:6px;left:6px;
    background:var(--scrim);
    color:#fff;
    font-size:.55rem;
    letter-spacing:.08em;
    padding:3px 6px;
    border-radius:999px;
  }
  .piece-name{
    font-size:.8rem;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .piece-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .piece-cat{
    font-size:.62rem;
    letter-spacing:.08em;
    color:var(--ink-soft);
  }
  .swatch-dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--shadow);flex:none;}

  /* ---------- empty state ---------- */
  .empty{
    text-align:center;
    padding:52px 20px 30px;
    color:var(--ink-soft);
  }
  .empty svg{width:44px;height:44px;color:var(--line);margin-bottom:14px;}
  .empty h3{font-size:1.2rem;margin-bottom:6px;color:var(--ink);}
  .empty p{font-size:.88rem;max-width:34ch;margin:0 auto;line-height:1.5;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    right:calc(50% - 360px + 20px);
    bottom:92px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--mustard);
    color:var(--on-mustard);
    border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px var(--shadow);
    cursor:pointer;
    z-index:20;
  }
  .fab svg{width:24px;height:24px;}
  @media (max-width:759px){
    .fab{right:20px;}
  }

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    justify-content:center;
    background:var(--canvas-raised);
    border-top:1px solid var(--line-soft);
    z-index:20;
  }
  .tabbar-inner{
    display:flex;
    width:100%;
    max-width:720px;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:none;
    border:none;
    padding:6px 4px;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:10px;
  }
  .tab svg{width:21px;height:21px;}
  .tab span{font-size:.64rem;letter-spacing:.04em;}
  .tab.active{color:var(--mustard-strong);}

  /* ---------- outfit cards ---------- */
  .outfit-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px;
  }
  .outfit-card{
    background:var(--canvas-raised);
    border-radius:16px;
    padding:16px 16px 14px;
    border:1.5px dashed var(--line);
    position:relative;
  }
  .outfit-label{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;
  }
  .outfit-label .mono{font-size:.62rem;letter-spacing:.09em;color:var(--denim);}
  .outfit-items{
    display:flex;
    justify-content:center;
    gap:2px;
    min-height:118px;
    align-items:flex-end;
    padding:6px 0 10px;
  }
  .outfit-item-photo{
    width:86px;height:86px;
    border-radius:10px;
    overflow:hidden;
    border:3px solid var(--canvas-raised);
    box-shadow:0 3px 10px var(--shadow);
    background:var(--canvas);
    flex:none;
  }
  .outfit-item-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .outfit-item-photo:nth-child(1){transform:rotate(-6deg);z-index:1;}
  .outfit-item-photo:nth-child(2){transform:rotate(3deg) translateY(-6px);z-index:2;}
  .outfit-item-photo:nth-child(3){transform:rotate(-3deg) translateY(2px);z-index:1;}
  .outfit-item-photo:nth-child(4){transform:rotate(7deg) translateY(-2px);z-index:0;}
  .outfit-foot{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;
    padding-top:10px;
    border-top:1px solid var(--line-soft);
  }
  .outfit-pieces-list{font-size:.72rem;color:var(--ink-soft);line-height:1.4;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .outfit-actions{display:flex;gap:2px;flex:none;}
  .heart-btn, .tryon-btn{
    background:none;border:none;cursor:pointer;
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    flex:none;
    border-radius:50%;
  }
  .heart-btn svg, .tryon-btn svg{width:20px;height:20px;}
  .heart-btn:hover, .tryon-btn:hover{background:var(--line-soft);}
  .heart-btn.saved{color:var(--berry);}
  .heart-btn.saved svg{fill:var(--berry);}

  .shuffle-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--mustard);color:var(--on-mustard);
    border:none;border-radius:999px;
    padding:11px 18px;
    font-weight:600;font-size:.86rem;
    cursor:pointer;
  }
  .btn svg{width:16px;height:16px;}
  .btn:active{transform:scale(.98);}
  .btn-ghost{
    background:none;border:1px solid var(--line);color:var(--ink);
    font-weight:500;
  }

  /* ---------- modal ---------- */
  .modal-scrim{
    position:fixed;inset:0;background:var(--scrim);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-sheet{
    background:var(--canvas);
    width:100%;max-width:720px;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    animation:slideUp .18s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{font-size:1.2rem;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:19px;height:19px;}

  .upload-well{
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:28px 16px;
    text-align:center;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .upload-well svg{width:30px;height:30px;color:var(--line);}
  .upload-well b{color:var(--ink);font-weight:600;}

  .draft-preview{display:flex;gap:14px;align-items:center;margin-bottom:16px;}
  .draft-photo{width:88px;height:88px;border-radius:12px;overflow:hidden;flex:none;background:var(--canvas-raised);}
  .draft-photo img{width:100%;height:100%;object-fit:cover;}
  .draft-color-row{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ink-soft);}
  .draft-color-row .swatch-dot{width:16px;height:16px;}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px;}
  .chip{
    border:1px solid var(--line);
    background:var(--canvas-raised);
    color:var(--ink);
    padding:8px 13px;
    border-radius:999px;
    font-size:.78rem;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .chip.selected{background:var(--denim);border-color:var(--denim);color:#fff;}

  .field-label{font-size:.68rem;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 8px;}

  .detail-photo{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;margin-bottom:16px;background:var(--canvas-raised);}
  .detail-photo img{width:100%;height:100%;object-fit:cover;}
  .detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:.85rem;}
  .detail-row:last-of-type{border-bottom:none;}

  .text-input{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--canvas-raised);
    color:var(--ink);
    font-size:.9rem;
    font-family:inherit;
    margin:0 0 18px;
  }
  .text-input:disabled{opacity:.6;cursor:not-allowed;}

  /* ---------- self photo / try-on ---------- */
  .selfie-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--canvas-raised);
    border:1px solid var(--line-soft);
    border-radius:999px;
    padding:5px 12px 5px 5px;
    cursor:pointer;
    color:var(--ink);
    font-size:.76rem;
  }
  .selfie-chip-photo{
    width:26px;height:26px;border-radius:50%;
    overflow:hidden;background:var(--canvas);
    display:flex;align-items:center;justify-content:center;
    flex:none;color:var(--ink-soft);
  }
  .selfie-chip-photo img{width:100%;height:100%;object-fit:cover;}
  .selfie-chip-photo svg{width:15px;height:15px;}

  .tryon-badge{
    display:inline-block;
    font-size:.62rem;letter-spacing:.08em;
    color:var(--denim);
    background:var(--denim-soft);
    padding:5px 10px;border-radius:999px;
    margin-bottom:14px;
  }
  .tryon-photo-wrap{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    border-radius:16px;
    overflow:hidden;
    background:var(--canvas-raised);
    margin-bottom:14px;
  }
  .tryon-photo-wrap > img{width:100%;height:100%;object-fit:cover;display:block;}
  .tryon-piece{
    position:absolute;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 14px var(--shadow);
    border:2px solid rgba(255,255,255,.88);
  }
  .tryon-piece img{width:100%;height:100%;object-fit:cover;display:block;opacity:.96;}
  .tryon-note{font-size:.78rem;color:var(--ink-soft);line-height:1.5;margin:0 0 16px;}

  button:focus-visible, .chip:focus-visible, .piece:focus-visible, input:focus-visible, a:focus-visible, label:focus-within{
    outline:2px solid var(--mustard-strong);
    outline-offset:2px;
  }

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:var(--canvas);
    padding:10px 16px;border-radius:999px;
    font-size:.82rem;
    z-index:60;
    box-shadow:0 8px 20px var(--shadow);
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important;}
  }
</style>

<div id="shell">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-1.1 0-2 .8-2 1.8 0 .66.38 1.24.98 1.6L12 7.6l1.02-1.2c.6-.36.98-.94.98-1.6C14 3.8 13.1 3 12 3z"/><path d="M12 7.6 2.6 13.9c-1.1.75-.58 2.5.75 2.5H20.65c1.33 0 1.85-1.75.75-2.5L12 7.6z"/></svg>
      <span class="brand-name">Flatlay</span>
    </div>
    <div class="piece-count mono" id="pieceCount">0 PIECES</div>

  <main id="main"></main>

  <button class="fab" id="fabAdd" aria-label="Add a piece">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab" data-tab="closet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-1.1 0-2 .8-2 1.8 0 .66.38 1.24.98 1.6L12 7.6l1.02-1.2c.6-.36.98-.94.98-1.6C14 3.8 13.1 3 12 3z"/><path d="M12 7.6 2.6 13.9c-1.1.75-.58 2.5.75 2.5H20.65c1.33 0 1.85-1.75.75-2.5L12 7.6z"/></svg>
        <span>Closet</span>
      </button>
      <button class="tab" data-tab="outfits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.6 4.6L17 9l-4.4 1.4L11 15l-1.6-4.6L5 9l4.4-1.4L11 3z"/><path d="M18 13l.9 2.5L21 16l-2.1.9L18 19l-.9-2.1L15 16l2.1-.5L18 13z"/></svg>
        <span>Outfits</span>
      </button>
      <button class="tab" data-tab="saved">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.3s-7-4.4-9.3-8.8C1.4 8.6 3 5.3 6.2 5.3c1.9 0 3.3 1 5.8 3.6 2.5-2.6 3.9-3.6 5.8-3.6 3.2 0 4.8 3.3 3.5 6.2-2.3 4.4-9.3 8.8-9.3 8.8z"/></svg>
        <span>Saved</span>
      </button>
    </div>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";

/* ============================= constants ============================= */
var CATEGORIES = [
  {key:"top", label:"Top", code:"TOP"},
  {key:"bottom", label:"Bottom", code:"BTM"},
  {key:"dress", label:"Dress", code:"DRS"},
  {key:"outerwear", label:"Outerwear", code:"OUT"},
  {key:"shoes", label:"Shoes", code:"SHU"},
  {key:"accessory", label:"Accessory", code:"ACC"}
];
function catInfo(key){ for(var i=0;i<CATEGORIES.length;i++){ if(CATEGORIES[i].key===key) return CATEGORIES[i]; } return {key:key,label:key,code:"?"}; }

/* ============================== state ================================= */
var state = {
  view: "closet",
  items: [],            // real, backed by db or local storage when available
  favoriteDocs: [],      // from Claude db: {docId, itemIds, createdAt}
  localFavorites: [],    // from IndexedDB, or session-only when no storage at all
  generated: [],          // current outfit suggestions
  db: null,
  assetsApi: null,
  storageMode: "memory", // "cloud" (Claude db/assets) | "local" (IndexedDB) | "memory" (session only)
  draft: null,           // {previewURL, blob, color, category, name}
  detailItem: null,
  selfPhoto: null,       // {assetId, photoSrc}
  ready: false
};

var SAMPLES = [];
var tryOnCurrentOutfit = null;

/* ======================= local (on-device) storage ======================= */
var LOCAL_DB_NAME = "flatlay-db";
var LOCAL_DB_VERSION = 1;
var localDbPromise = null;
function openLocalDb(){
  if(localDbPromise) return localDbPromise;
  localDbPromise = new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error("no indexeddb")); return; }
    var req = indexedDB.open(LOCAL_DB_NAME, LOCAL_DB_VERSION);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains("items")) db.createObjectStore("items", {keyPath:"id"});
      if(!db.objectStoreNames.contains("favorites")) db.createObjectStore("favorites", {keyPath:"id"});
      if(!db.objectStoreNames.contains("profile")) db.createObjectStore("profile", {keyPath:"id"});
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return localDbPromise;
}
function localPut(storeName, obj){
  return openLocalDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).put(obj);
      tx.oncomplete = function(){ resolve(obj); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function localDelete(storeName, id){
  return openLocalDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).delete(id);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function localGetAll(storeName){
  return openLocalDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(storeName, "readonly");
      var req = tx.objectStore(storeName).getAll();
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function localGet(storeName, id){
  return openLocalDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(storeName, "readonly");
      var req = tx.objectStore(storeName).get(id);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function loadAllFromLocalDb(){
  Promise.all([localGetAll("items"), localGetAll("favorites"), localGet("profile","main")]).then(function(results){
    var items = results[0] || [], favs = results[1] || [], profile = results[2];
    items.sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
    state.items = items.map(function(it){
      var copy = {};
      for(var k in it){ if(it.hasOwnProperty(k)) copy[k] = it[k]; }
      if(copy.photoBlob){ copy.photoSrc = URL.createObjectURL(copy.photoBlob); }
      return copy;
    });
    state.localFavorites = favs.map(function(f){
      var favItems = (f.itemIds||[]).map(function(id){ return state.items.find(function(i){ return i.id===id; }); }).filter(Boolean);
      return {key:(f.itemIds||[]).slice().sort().join("|"), itemIds:f.itemIds, items:favItems, createdAt:f.createdAt, docId:f.id};
    }).filter(function(f){ return f.items.length; });
    if(profile && profile.photoBlob){ state.selfPhoto = {photoSrc: URL.createObjectURL(profile.photoBlob)}; }
    render();
  }).catch(function(e){ console.warn("local storage load failed", e); render(); });
}
function initStorage(){

    window.claude.use("db").then(function(db){

/* ============================ color math =============================== */
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  var max=Math.max(r,g,b), min=Math.min(r,g,b);
  var h=0,s=0,l=(max+min)/2;
  var d=max-min;
  if(d!==0){
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d + (g<b?6:0); break;
      case g: h=(b-r)/d + 2; break;
      case b: h=(r-g)/d + 4; break;
    }
    h*=60;
  }
  return [h, s*100, l*100];
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  var c=(1-Math.abs(2*l-1))*s;
  var x=c*(1-Math.abs((h/60)%2-1));
  var m=l-c/2;
  var r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  var R=Math.round((r+m)*255), G=Math.round((g+m)*255), B=Math.round((b+m)*255);
  return "#"+[R,G,B].map(function(v){ v=Math.max(0,Math.min(255,v)); var s2=v.toString(16); return s2.length===1?"0"+s2:s2; }).join("");
}
function hexToHsl(hex){
  hex=hex.replace("#","");
  var r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  var hsl=rgbToHsl(r,g,b);
  return {h:Math.round(hsl[0]), s:Math.round(hsl[1]), l:Math.round(hsl[2])};
}

function extractDominantColor(imgEl){
  try{
    var size=32;
    var c=document.createElement("canvas"); c.width=size; c.height=size;
    var ctx=c.getContext("2d");
    var iw=imgEl.naturalWidth||size, ih=imgEl.naturalHeight||size;
    var side=Math.min(iw,ih);
    var sx=(iw-side)/2, sy=(ih-side)/2;
    ctx.drawImage(imgEl, sx, sy, side, side, 0, 0, size, size);
    var data=ctx.getImageData(0,0,size,size).data;
    var sumSin=0,sumCos=0,sumSatColorful=0,countColorful=0,sumLall=0,countAll=0;
    for(var i=0;i<data.length;i+=4){
      var r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a<128) continue;
      var hsl=rgbToHsl(r,g,b);
      var h=hsl[0], s=hsl[1], l=hsl[2];
      countAll++; sumLall+=l;
      if(s>12 && l>8 && l<92){
        var rad=h*Math.PI/180;
        sumSin += Math.sin(rad)*(s/100);
        sumCos += Math.cos(rad)*(s/100);
        sumSatColorful += s;
        countColorful++;
      }
    }
    if(countAll===0) return {h:38,s:16,l:58,hex:"#C9BFA9"};
    if(countColorful/countAll > 0.12){
      var hue=Math.atan2(sumSin,sumCos)*180/Math.PI; if(hue<0) hue+=360;
      var avgS=Math.min(sumSatColorful/countColorful, 82);
      var avgL=Math.max(22, Math.min(sumLall/countAll, 76));
      return {h:Math.round(hue), s:Math.round(avgS), l:Math.round(avgL), hex:hslToHex(hue,avgS,avgL)};
    } else {
      var avgL2=sumLall/countAll;
      return {h:0, s:6, l:Math.round(avgL2), hex:hslToHex(0,6,avgL2)};
    }
  }catch(e){
    return {h:38,s:16,l:58,hex:"#C9BFA9"};
  }
}

function makeSampleImage(hex, emoji){
  var c=document.createElement("canvas"); c.width=400; c.height=400;
  var ctx=c.getContext("2d");
  ctx.fillStyle=hex; ctx.fillRect(0,0,400,400);
  var g=ctx.createRadialGradient(180,140,30,200,220,320);
  g.addColorStop(0,"rgba(255,255,255,0.22)");
  g.addColorStop(1,"rgba(0,0,0,0.14)");
  ctx.fillStyle=g; ctx.fillRect(0,0,400,400);
  ctx.font='224px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign="center"; ctx.textBaseline="middle";
  try{ ctx.fillText(emoji,200,222); }catch(e){}
  return c.toDataURL("image/png");
}

/* ========================= outfit generation =========================== */
function isNeutral(item){ return item.s < 14 || item.l > 90 || item.l < 12; }
function hueDist(a,b){ var d=Math.abs(a-b)%360; return d>180?360-d:d; }
function pairScore(a,b){
  if(isNeutral(a) || isNeutral(b)) return 1.0;
  var d=hueDist(a.h,b.h);
  if(d<30) return 1.6;
  if(d<60) return 0.6;
  if(d<100) return -1.4;
  if(d<140) return 0.3;
  if(d<160) return -0.2;
  return 1.8;
}
function harmonyLabel(items){
  var nonNeutral = items.filter(function(i){ return !isNeutral(i); });
  if(nonNeutral.length < 2){
    var avgS = items.reduce(function(s,i){return s+i.s;},0)/items.length;
    return avgS > 35 ? "Neutral · Grounded" : "Neutral · Easy";
  }
  var total=0, n=0;
  for(var i=0;i<nonNeutral.length;i++){
    for(var j=i+1;j<nonNeutral.length;j++){ total += hueDist(nonNeutral[i].h, nonNeutral[j].h); n++; }
  }
  var avgD = n ? total/n : 0;
  var avgS2 = nonNeutral.reduce(function(s,i){return s+i.s;},0)/nonNeutral.length;
  var bold = avgS2 > 50;
  if(avgD < 30) return bold ? "Analogous · Rich" : "Analogous · Tonal";
  if(avgD < 100) return bold ? "Triadic · Playful" : "Triadic · Soft";
  return bold ? "Complementary · Bold" : "Complementary · Muted";
}
function scoreCombo(items){
  var total=0, pairs=0;
  for(var i=0;i<items.length;i++){
    for(var j=i+1;j<items.length;j++){ total += pairScore(items[i], items[j]); pairs++; }
  }
  var lights = items.map(function(i){return i.l;});
  var range = Math.max.apply(null,lights) - Math.min.apply(null,lights);
  var variety = (range>=15 && range<=65) ? 0.6 : 0;
  var anchor = items.some(isNeutral) ? 0.4 : 0;
  var jitter = Math.random()*0.5;
  return total + variety + anchor + jitter;
}
function buildCombos(items){
  var by = {};
  CATEGORIES.forEach(function(c){ by[c.key]=[]; });
  items.forEach(function(it){ if(by[it.category]) by[it.category].push(it); });
  var combos = [];
  var shoeOpts = by.shoes.length ? by.shoes : [null];
  var outerOpts = [null].concat(by.outerwear);

  by.dress.forEach(function(dress){
    shoeOpts.forEach(function(shoe){
      outerOpts.forEach(function(outer){
        var c=[dress, shoe, outer].filter(Boolean);
        if(c.length>=2) combos.push(c);
      });
    });
  });

  by.top.forEach(function(top){
    by.bottom.forEach(function(bottom){
      shoeOpts.forEach(function(shoe){
        outerOpts.forEach(function(outer){
          var c=[top, bottom, shoe, outer].filter(Boolean);
          if(c.length>=2) combos.push(c);
        });
      });
    });
  });

  if(combos.length > 600){
    combos.sort(function(){ return Math.random()-0.5; });
    combos = combos.slice(0,600);
  }
  return combos;
}
function generateOutfits(count){
  var items = activeCloset();
  var combos = buildCombos(items);
  if(!combos.length) return [];
  var scored = combos.map(function(c){ return {items:c, score:scoreCombo(c)}; });
  scored.sort(function(a,b){ return b.score-a.score; });
  var seen = {}; var out=[];
  for(var i=0;i<scored.length && out.length<count;i++){
    var key = scored[i].items.map(function(it){return it.id;}).sort().join("|");
    if(seen[key]) continue;
    seen[key]=true;
    out.push({key:key, items:scored[i].items, label:harmonyLabel(scored[i].items)});
  }
  return out;
}

/* ============================= favorites =============================== */
function currentFavorites(){
  var real = state.favoriteDocs.map(function(fd){
    var items = fd.itemIds.map(function(id){ return state.items.find(function(it){return it.id===id;}); }).filter(Boolean);
    if(items.length !== fd.itemIds.length) return null;
    return {key: fd.itemIds.slice().sort().join("|"), items:items, docId:fd.docId, label:harmonyLabel(items)};
  }).filter(Boolean);
  var local = state.localFavorites.map(function(lf){
    return {key:lf.key, items:lf.items, local:true, docId:lf.docId, label:harmonyLabel(lf.items)};
  });
  return real.concat(local);
}
function isFavorited(outfit){
  return currentFavorites().some(function(f){ return f.key===outfit.key; });
}
function toggleFavorite(outfit){
  var existing = currentFavorites().find(function(f){ return f.key===outfit.key; });
  if(existing){
    if(existing.local){
      state.localFavorites = state.localFavorites.filter(function(f){ return f.key!==outfit.key; });
      render();
      if(state.storageMode==="local" && existing.docId){ localDelete("favorites", existing.docId).catch(function(){}); }
    } else {
      state.favoriteDocs = state.favoriteDocs.filter(function(fd){ return fd.docId!==existing.docId; });
      render();
      if(state.db){ state.db.collection("favorites").doc(existing.docId).delete().catch(function(){}); }
    }
    return;
  }
  var hasSample = outfit.items.some(function(i){ return i.sample; });
  if(!hasSample && state.storageMode==="cloud" && state.db){
    state.db.collection("favorites").add({
      itemIds: outfit.items.map(function(i){return i.id;}),
      createdAt: new Date().toISOString()
    }).catch(function(){ toast("Couldn't save this look — try again"); });
    return;
  }
  var favId = "fav-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
  state.localFavorites = [{key:outfit.key, itemIds:outfit.items.map(function(i){return i.id;}), items:outfit.items, createdAt:Date.now(), docId:favId}].concat(state.localFavorites);
  render();
  if(!hasSample && state.storageMode==="local"){
    localPut("favorites", {id:favId, itemIds:outfit.items.map(function(i){return i.id;}), createdAt:Date.now()}).catch(function(){});
  }
}

var toastTimer=null;
function toast(msg){
  var root=document.getElementById("toastRoot");
  root.innerHTML = '<div class="toast">'+escapeHtml(msg)+"</div>";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ root.innerHTML=""; }, 2600);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

  "</div>";

function openTryOn(outfit){
  tryOnCurrentOutfit = outfit;
  renderTryOnModal();
}
function renderTryOnModal(){
  var outfit = tryOnCurrentOutfit;
  var src = selfPhotoSrc();
  var title = outfit ? "Preview on you" : "Your photo";
  var html = '<div class="modal-scrim" id="scrim">'+
    '<div class="modal-sheet">'+
      '<div class="modal-head"><h3>'+title+'</h3>'+
      '<button class="icon-btn" id="closeTryon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';

  if(!src){
    html += '<label class="upload-well" for="selfFileInput">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M8 7l1.6-2h4.8L16 7"/><circle cx="12" cy="13" r="3.2"/></svg>'+
      "<div><b>Add a photo of yourself</b><div>a simple standing photo works best</div></div>"+
      '<input id="selfFileInput" type="file" accept="image/*" style="display:none;">'+
      "</label>";
  } else {
    html += '<div class="tryon-badge mono">PREVIEW · NOT A REAL FIT</div>';
    html += '<div class="tryon-photo-wrap"><img src="'+src+'" alt="You">';
    if(outfit){
      outfit.items.forEach(function(item){
        var pos = TRYON_POSITIONS[item.category];
        if(pos) html += tryOnPieceHtml(item, pos);
      });
    }
    html += "</div>";
    html += outfit
      ? '<p class="tryon-note">'+escapeHtml(outfit.label)+" — pieces placed roughly over your photo so you can get a feel for the look.</p>"
      : '<p class="tryon-note">This photo is used to preview outfits. Open any look in Outfits and tap the person icon to try it.</p>';
    html += '<label class="btn btn-ghost" for="selfFileInput" style="width:100%;justify-content:center;cursor:pointer;">Change photo</label>'+
      '<input id="selfFileInput" type="file" accept="image/*" style="display:none;">';
  }

  html += "</div></div>";
  document.getElementById("modalRoot").innerHTML = html;
  document.getElementById("scrim").addEventListener("click", function(e){ if(e.target.id==="scrim") closeModal(); });
  document.getElementById("closeTryon").addEventListener("click", closeModal);
  var sfi = document.getElementById("selfFileInput");
  if(sfi){ sfi.addEventListener("change", handleSelfFileChosen); }
}
function handleSelfFileChosen(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var url = URL.createObjectURL(file);
  state.selfPhoto = {photoSrc:url, assetId:null};
  renderTryOnModal();
  render();
  if(state.storageMode==="cloud" && state.db && state.assetsApi){
    state.assetsApi.upload(file).then(function(up){
      state.selfPhoto.assetId = up.id;
      return state.db.collection("profile").doc("main").set({assetId:up.id, updatedAt:new Date().toISOString()});
    }).catch(function(){ toast("Couldn't save your photo, but it'll work for this visit."); });
  } else if(state.storageMode==="local"){
    localPut("profile", {id:"main", photoBlob:file, updatedAt:Date.now()}).catch(function(){ toast("Couldn't save your photo on this device."); });
  }
}
function loadProfile(){
  state.db.collection("profile").doc("main").get().then(function(snap){
    if(snap.exists){
      var data = snap.data();
      if(data.assetId){ state.selfPhoto = {assetId:data.assetId, photoSrc:null}; render(); }
    }
  }).catch(function(){});
}

/* =========================== main view wiring =========================== */
function wireMain(){
  document.querySelectorAll("[data-open-item]").forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-open-item");
      var item = activeCloset().find(function(i){ return i.id===id; });
      if(item) openDetail(item);
    });
  });
  var shuffleBtn = document.getElementById("shuffleBtn");
  if(shuffleBtn){ shuffleBtn.addEventListener("click", function(){ state.generated = generateOutfits(6); render(); }); }
  document.querySelectorAll("[data-fav-key]").forEach(function(el){
    el.addEventListener("click", function(){
      var payload = JSON.parse(decodeURIComponent(el.getAttribute("data-fav-payload")));
      toggleFavorite(payload);
    });
  });
  document.querySelectorAll("[data-tryon-payload]").forEach(function(el){
    el.addEventListener("click", function(){
      var payload = JSON.parse(decodeURIComponent(el.getAttribute("data-tryon-payload")));
      openTryOn(payload);
    });
  });
  var selfieChip = document.getElementById("selfieChip");
  if(selfieChip){ selfieChip.addEventListener("click", function(){ openTryOn(null); }); }
}

document.querySelectorAll(".tab").forEach(function(btn){
  btn.addEventListener("click", function(){
    state.view = btn.getAttribute("data-tab");
    if(state.view==="outfits") state.generated = generateOutfits(6);
    render();
  });
});

/* ================================ modals ================================= */
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }

function openDetail(item){
  var ci = catInfo(item.category);
  var html = '<div class="modal-scrim" id="scrim">'+
    '<div class="modal-sheet">'+
      '<div class="modal-head"><h3>Piece</h3>'+
      '<button class="icon-btn" id="closeDetail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
      '<div class="detail-photo"><img src="'+itemPhotoSrc(item)+'" alt=""></div>'+
      '<div class="field-label">Name</div>'+
      '<input id="itemNameInput" class="text-input" type="text" placeholder="'+escapeHtml(ci.label)+'" value="'+escapeHtml(item.label||"")+'" '+(item.sample?"disabled":"")+'>'+
      '<div class="detail-row"><span class="field-label" style="margin:0;">Category</span><span class="mono">'+ci.code+'</span></div>'+
      '<div class="detail-row"><span class="field-label" style="margin:0;">Color</span><span style="display:flex;align-items:center;gap:8px;"><span class="swatch-dot" style="background:'+item.hex+'"></span><span class="mono">'+item.hex.toUpperCase()+'</span></span></div>'+
      (item.sample ? '<div class="detail-row"><span class="field-label" style="margin:0;">Note</span><span>Example piece</span></div>' : "")+
      '<button class="btn btn-ghost" id="removeItem" style="width:100%;justify-content:center;margin-top:18px;">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'+
        "Remove from closet</button>"+
    "</div></div>";
  document.getElementById("modalRoot").innerHTML = html;
  document.getElementById("scrim").addEventListener("click", function(e){ if(e.target.id==="scrim") closeModal(); });
  document.getElementById("closeDetail").addEventListener("click", closeModal);
  document.getElementById("removeItem").addEventListener("click", function(){ deleteItem(item); closeModal(); });
  var nameInput = document.getElementById("itemNameInput");
  if(nameInput && !item.sample){
    nameInput.addEventListener("change", function(){ renameItem(item, nameInput.value); });
  }
}

function renameItem(item, newLabel){
  newLabel = (newLabel||"").trim();
  var idx = state.items.findIndex(function(i){ return i.id===item.id; });
  if(idx>-1) state.items[idx].label = newLabel;
  item.label = newLabel;
  render();
  if(state.storageMode==="cloud" && state.db && item.assetId){
    state.db.collection("items").doc(item.id).update({label:newLabel}).catch(function(){ toast("Couldn't save the name"); });
  } else if(state.storageMode==="local"){
    localGet("items", item.id).then(function(rec){
      if(rec){ rec.label = newLabel; return localPut("items", rec); }
    }).catch(function(){ toast("Couldn't save the name"); });
  }
}

function deleteItem(item){
  if(item.sample){
    SAMPLES = SAMPLES.filter(function(s){ return s.id!==item.id; });
    render();
    return;
  }
  state.items = state.items.filter(function(i){ return i.id!==item.id; });
  render();
  if(state.storageMode==="cloud" && state.db){
    state.db.collection("items").doc(item.id).delete().catch(function(){});
    if(state.assetsApi && item.assetId){
      state.assetsApi.delete(item.assetId).catch(function(){});
    }
  } else if(state.storageMode==="local"){
    localDelete("items", item.id).catch(function(){});
  }
}

function openAddSheet(){
  state.draft = {previewURL:null, blob:null, color:null, category:null, name:""};
  renderAddSheet();
}

function renderAddSheet(){
  var d = state.draft;
  var html = '<div class="modal-scrim" id="scrim">'+
    '<div class="modal-sheet">'+
      '<div class="modal-head"><h3>Add a piece</h3>'+
      '<button class="icon-btn" id="closeAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';

  if(!d.previewURL){
    html += '<label class="upload-well" for="fileInput">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M8 7l1.6-2h4.8L16 7"/><circle cx="12" cy="13" r="3.2"/></svg>'+
      "<div><b>Add a photo</b><div>from your camera or photo library</div></div>"+
      '<input id="fileInput" type="file" accept="image/*" style="display:none;">'+
      "</label>";
  } else {
    html += '<div class="draft-preview">'+
      '<div class="draft-photo"><img src="'+d.previewURL+'" alt=""></div>'+
      '<div class="draft-color-row"><span class="swatch-dot" style="background:'+d.color.hex+'"></span><span class="mono">'+d.color.hex.toUpperCase()+"</span></div>"+
      "</div>";
    html += '<div class="field-label">Name (optional)</div>'+
      '<input id="pieceNameInput" class="text-input" type="text" placeholder="e.g. Blue oxford shirt" value="'+escapeHtml(d.name||"")+'">';
    html += '<div class="field-label">Category</div><div class="chip-row" id="chipRow">';
    CATEGORIES.forEach(function(c){
      html += '<button class="chip'+(d.category===c.key?" selected":"")+'" data-cat="'+c.key+'">'+c.label+"</button>";
    });
    html += "</div>";
    html += '<button class="btn" id="saveDraft" style="width:100%;justify-content:center;" '+(d.category?"":"disabled")+'>Add to closet</button>';
  }
  html += "</div></div>";
  document.getElementById("modalRoot").innerHTML = html;
  document.getElementById("scrim").addEventListener("click", function(e){ if(e.target.id==="scrim") closeModal(); });
  document.getElementById("closeAdd").addEventListener("click", closeModal);
  var fi = document.getElementById("fileInput");
  if(fi){ fi.addEventListener("change", handleFileChosen); }
  document.querySelectorAll("[data-cat]").forEach(function(el){
    el.addEventListener("click", function(){
      var nameInput = document.getElementById("pieceNameInput");
      if(nameInput) state.draft.name = nameInput.value;
      state.draft.category = el.getAttribute("data-cat");
      renderAddSheet();
    });
  });
  var saveBtn = document.getElementById("saveDraft");
  if(saveBtn){ saveBtn.addEventListener("click", saveDraftItem); }
}

function handleFileChosen(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function(){
    var color = extractDominantColor(img);
    state.draft.previewURL = url;
    state.draft.blob = file;
    state.draft.color = color;
    renderAddSheet();
  };
  img.onerror = function(){ toast("Couldn't read that photo — try another."); };
  img.src = url;
}

function saveDraftItem(){
  var d = state.draft;
  if(!d || !d.category || !d.blob) return;
  var nameInput = document.getElementById("pieceNameInput");
  var name = (nameInput ? nameInput.value : (d.name||"")).trim();
  closeModal();
  var localId = "local-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
  var optimistic = {
    id: localId, category: d.category, h:d.color.h, s:d.color.s, l:d.color.l, hex:d.color.hex,
    label:name, photoSrc: d.previewURL, pending: true
  };
  state.items = [optimistic].concat(state.items);
  render();

  if(state.storageMode==="cloud" && state.db && state.assetsApi){
    state.assetsApi.upload(d.blob).then(function(up){
      return state.db.collection("items").add({
        category: d.category, h:d.color.h, s:d.color.s, l:d.color.l, hex:d.color.hex,
        assetId: up.id, label:name, createdAt: new Date().toISOString()
      });
    }).then(function(){
      state.items = state.items.filter(function(i){ return i.id!==localId; });
      render();
    }).catch(function(err){
      console.warn(err);
      toast("Couldn't save that photo — it will disappear when you leave.");
    });
  } else if(state.storageMode==="local"){
    localPut("items", {
      id: localId, category: d.category, h:d.color.h, s:d.color.s, l:d.color.l, hex:d.color.hex,
      label:name, photoBlob:d.blob, createdAt: Date.now()
    }).catch(function(err){
      console.warn(err);
      toast("Couldn't save that photo on this device.");
    });
  }
}

document.getElementById("fabAdd").addEventListener("click", openAddSheet);

/* ============================ db subscriptions =========================== */
function subscribeItems(){
  state.db.collection("items").orderBy("createdAt","desc").limit(300).onSnapshot(function(snap){
    state.items = snap.docs.map(function(d){
      var data=d.data();
      return {id:d.id, category:data.category, h:data.h, s:data.s, l:data.l, hex:data.hex, assetId:data.assetId, label:data.label};
    });
    state.generated = [];
    render();
  }, function(err){ console.warn("items snapshot error", err); });
}
function subscribeFavorites(){
  state.db.collection("favorites").orderBy("createdAt","desc").limit(200).onSnapshot(function(snap){
    state.favoriteDocs = snap.docs.map(function(d){
      var data=d.data();
      return {docId:d.id, itemIds:data.itemIds||[], createdAt:data.createdAt};
    });
    render();
  }, function(err){ console.warn("favorites snapshot error", err); });
}

/* =============================== boot ==================================== */
SAMPLES = buildSamples();
render();
initStorage();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

})();
</script>
